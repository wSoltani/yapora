<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Yapora's logo: the app in miniature. A dark disc for the avatar, the halo
    ring around it with the same small gap, and the symmetrical spectrum mouth.
    The background stays transparent. Source for `pnpm tauri icon`; the files
    in icons/ are generated from it.
  -->
  <defs>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <circle cx="512" cy="512" r="424" fill="none" stroke="url(#halo)" stroke-width="56" />
  <circle cx="512" cy="512" r="360" fill="#18181b" />

  <g fill="#ffffff">
    <rect x="236" y="422" width="72" height="180" rx="36" />
    <rect x="356" y="352" width="72" height="320" rx="36" />
    <rect x="476" y="282" width="72" height="460" rx="36" />
    <rect x="596" y="352" width="72" height="320" rx="36" />
    <rect x="716" y="422" width="72" height="180" rx="36" />
  </g>
</svg>
